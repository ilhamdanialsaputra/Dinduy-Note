name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install
          npm install --no-save @fontsource-variable/roboto-flex

      - name: Debug isi repo
        run: |
          pwd
          ls -la
          echo "--- scripts ---"
          ls -la scripts || true
          echo "--- cari prepare ---"
          find . -iname "*prepare*" -not -path "./node_modules/*"

      - name: Prepare Web
        run: node scripts/prepare-web.js

      - name: Initialize Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Sync Version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          APP_CODE=$(echo $APP_VERSION | sed 's/\.//g')
          sed -i -E "s/versionCode [0-9]+/versionCode $APP_CODE/g" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$APP_VERSION\"/g" android/app/build.gradle

      - name: Download Permanent Keystore
        run: wget https://raw.githubusercontent.com/expo/expo/main/templates/expo-template-bare-minimum/android/app/debug.keystore -O debug.keystore

      - name: Generate Android Icons
        if: hashFiles('assets/icon-only.png') != ''
        run: npx @capacitor/assets generate --android

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.injected.signing.store.file=${{ github.workspace }}/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dinduy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
